name: gitleaks

# Второй, неотключаемый рубеж после локального pre-commit хука:
# хук живёт в .git/hooks и обходится через --no-verify, а этот прогон — нет.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Обязательно: по умолчанию checkout делает shallow-клон,
          # и тогда gitleaks просканирует только последний коммит.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz
          gitleaks version

      - name: Scan full git history
        # --redact обязателен: логи Actions в публичном репозитории видны всем,
        # находка не должна утащить сам секрет в публичный лог.
        run: gitleaks git --redact --no-banner --exit-code 1 .
