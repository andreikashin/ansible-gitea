# смотреться со стороны обеих групп. Здесь только то, что нужно самой роли.

# Кто эта нода. Выводится из инвентаря, руками задавать не нужно.
k3s_node_role: >-
  {{ 'server' if inventory_hostname in groups['k3s_server_group'] else 'agent' }}
