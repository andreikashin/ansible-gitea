---
# Драйверы, у которых движок разгрузки замечен в порче данных.
#
# bnx2 (BCM5708/5709) на pve1, pve2 и pve3. Наблюдалось прямо: бэкап в PBS падал
# с "protocol canceled", а сервер писал "decryption failed or bad record mac",
# то есть TLS ловил изменившиеся в полёте биты. Счётчики Ethernet при этом
# чистые, потому что портит карта, а не провод.
#
# tg3 (BCM5719) на pve5 и pve7 в этом не замечен и в список не входит.
pve_nic_offload_drivers:
  - bnx2
