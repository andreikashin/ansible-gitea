---
# Версия прибита гвоздями и собирается из исходников, а не ставится пакетом.
# Причина неприятная и её стоит знать. Последний релиз MinIO с опубликованными
# артефактами (deb, rpm, образ) это 2025-09-07. Следующий, 2025-10-15, закрывает
# CVE с эскалацией привилегий через session policy у service accounts и STS, но
# бинарей к нему не выложили: в примечаниях к релизу предлагают go install или
# собрать образ самому. Дальше релизов не было вовсе.
#
# Ставить пакет значит осознанно занести в лабу известную дыру в хранилище, где
# будут лежать артефакты и бэкапы. Поэтому собираем. Если решишь, что CVE
# неактуален, переключение на .deb это три задачи вместо блока сборки.
minio_version: "RELEASE.2025-10-15T17-29-55Z"

# Go нужен только на сборку. Версия взята из toolchain в go.mod самого MinIO,
# чтобы сборка не тянула другой тулчейн на ходу.
minio_go_version: "1.24.8"
minio_go_url: "https://go.dev/dl/go{{ minio_go_version }}.linux-amd64.tar.gz"
minio_build_dir: /opt/minio-build

# Клиент. Он идёт отдельным проектом и артефакты у него публикуются, так что
# просто скачиваем бинарь.
minio_mc_version: "RELEASE.2025-08-13T08-35-41Z"
minio_mc_url: >-
  https://dl.min.io/client/mc/release/linux-amd64/archive/mc.{{ minio_mc_version }}

minio_bin: /usr/local/bin/minio
minio_version_marker: /usr/local/lib/minio.version
minio_mc_bin: /usr/local/bin/mc
minio_service_user: minio-user
minio_mount_prefix: /mnt/minio
minio_api_port: 9000

# Диски опознаются по by-id, а не по sdb, sdc и так далее. Порядок sd* задаётся
# порядком обнаружения и от загрузки к загрузке меняется, а MinIO на
# перепутанных дисках просто не стартует. Имя by-id у гостя Proxmox жёстко
# связано со слотом scsiN, который мы сами и назначили.
minio_disk_by_id: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi"

# Потребители хранилища. У каждого своя учётка и своя политика ровно на его
# бакеты: одному потребителю нечего делать в данных другого, а
# root-учётка не должна оказаться в конфиге приложения.
#
# Имена и пароли задаются в host_vars, здесь только пустой список, чтобы роль
# без настройки ничего не заводила молча.
minio_apps: []

# Все бакеты, которые должны существовать. Собираются из потребителей, отдельно
# перечислять не нужно.
minio_buckets: "{{ minio_apps | map(attribute='buckets') | flatten | unique | list }}"
