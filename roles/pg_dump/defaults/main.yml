---
# Логические дампы всех баз одного экземпляра Postgres, работающего в Docker.
#
# Имя контейнера и суперпользователя переопределяются в host_vars: на разных
# инстансах они зовутся по-разному, и угадать это нельзя.
pg_dump_container: postgres
pg_dump_superuser: postgres

# База для служебного подключения. Без явного указания psql лезет в базу,
# названную по имени пользователя, и на инстансе, где суперюзер зовётся не
# postgres, соединение не открывается вовсе. Именно на этом первый прогон и
# упал, когда роль ещё была россыпью файлов.
pg_dump_maint_db: postgres

pg_dump_docker: /usr/bin/docker
pg_dump_bin: /usr/local/bin/pg-dump
pg_dump_config_dir: /etc/pg-dump

# Каталог на набор. Наборы с разной частотой обязаны лежать в РАЗНЫХ каталогах:
# мониторинг смотрит на возраст свежего файла в каталоге, и частый набор иначе
# вечно освежает его и маскирует застрявший редкий.
pg_dump_dest: /var/backups/pg

# 56 файлов при шаге в шесть часов это 14 дней истории. Ротация по числу, а не
# по возрасту: если таймер простоит две недели, ротация по возрасту снесёт всё,
# включая единственную уцелевшую копию.
pg_dump_keep: 56

pg_dump_oncalendar: '*-*-* 00,06,12,18:10:00'
