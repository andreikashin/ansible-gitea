---
# Agent identity (jenkins_agent_vmid / _name / _workdir / _jar) is defined in the
# gitignored host_vars/jenkins_agent.yml so these internal identifiers stay out of
# this public repo. All guest ops go through `qm guest exec {{ jenkins_agent_vmid }}`.

# --- Inbound (JNLP) build-agent service -------------------------------------
# The agent is an inbound agent launched on the VM itself. It was started by
# hand, so it survived neither a VM reboot nor a controller restart. Run it
# under systemd (Restart=always) so it auto-starts on boot and reconnects.
jenkins_agent_manage_service: true
# Controller URL derived from the Jenkins node's (gitignored) host_vars so no
# internal IP is hardcoded here. jenkins_ct_ip lives in host_vars/jenkins_node.yml.
jenkins_agent_controller_url: "http://{{ hostvars[groups['jenkins_group'][0]].jenkins_ct_ip }}:{{ hostvars[groups['jenkins_group'][0]].jenkins_http_port }}/"
jenkins_agent_java: "/usr/bin/java"
jenkins_agent_run_user: "root"
jenkins_agent_env_file: "/etc/jenkins-agent.env"
# jenkins_agent_secret is set in secrets.yml (gitignored) and is required when
# jenkins_agent_manage_service is true.
jenkins_agent_secret: ""

# Paths for the GC units/script on the agent.
jenkins_agent_gc_script: /usr/local/bin/docker-gc.sh
jenkins_agent_gc_env_file: /etc/docker-gc.env

# Buildkit build-cache upper bound (also enforced continuously via daemon.json).
jenkins_agent_gc_build_cache_keep: "10GB"

# Only remove unused images older than this many hours (avoids racing an
# in-flight build that just built but hasn't pushed yet).
jenkins_agent_gc_image_max_age_hours: 24

# Extended-regex of image refs to NEVER auto-remove. These are pulled base
# images that are expensive to re-download and meant to stay cached.
jenkins_agent_gc_protect_regex: "cimg/|moby/buildkit"

# When the timer fires (systemd OnCalendar). Default: nightly at 04:00.
jenkins_agent_gc_timer_schedule: "*-*-* 04:00:00"

# Set true to also run a GC pass immediately when the role is applied.
jenkins_agent_gc_run_now: false

# Merged (recursively) into /etc/docker/daemon.json; existing keys are kept.
jenkins_agent_docker_daemon:
  builder:
    gc:
      enabled: true
      defaultKeepStorage: "{{ jenkins_agent_gc_build_cache_keep }}"
