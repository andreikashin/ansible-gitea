---
# Keeps the Jenkins build agent (VM {{ jenkins_agent_vmid }} on the pve host)
# from filling its disk with Docker images and build cache.
#
# The play targets the *pve host*, not the agent: the agent VM was created out
# of band and doesn't trust our SSH key, so we drive it through the qemu guest
# agent (`qm guest exec`) — the VM analogue of the `pct exec` pattern this repo
# uses for LXC containers. Two mechanisms are installed:
#   1. a buildkit GC policy in /etc/docker/daemon.json  -> bounds build cache
#   2. a systemd timer running docker-gc.sh             -> reclaims stale images

- name: Require the agent identity vars (from gitignored host_vars/jenkins_agent.yml)
  ansible.builtin.assert:
    that:
      - jenkins_agent_vmid is defined
      - jenkins_agent_name is defined
      - jenkins_agent_workdir is defined
      - jenkins_agent_jar is defined
    fail_msg: >-
      Agent identity is not set. Provide host_vars/jenkins_agent.yml with
      jenkins_agent_vmid/_name/_workdir/_jar (it's gitignored, not in the repo).

- name: Confirm the guest agent is responsive
  ansible.builtin.command:
    argv: [qm, guest, exec, "{{ jenkins_agent_vmid }}", "--", /bin/true]
  register: jenkins_agent_agent_ping
  changed_when: false
  failed_when: jenkins_agent_agent_ping.rc != 0

# --- 1. buildkit GC via daemon.json (merged, existing keys preserved) --------

- name: Read existing /etc/docker/daemon.json from guest
  ansible.builtin.command:
    argv: [qm, guest, exec, "{{ jenkins_agent_vmid }}", "--", /bin/cat, /etc/docker/daemon.json]
  register: jenkins_agent_daemon_read
  changed_when: false
  failed_when: false

- name: Parse existing daemon config
  ansible.builtin.set_fact:
    jenkins_agent_daemon_existing: >-
      {{
        ((jenkins_agent_daemon_read.stdout | from_json)['out-data'] | from_json)
        if ((jenkins_agent_daemon_read.stdout | from_json).exitcode | default(1)) == 0
        else {}
      }}

- name: Compute merged daemon config
  ansible.builtin.set_fact:
    jenkins_agent_daemon_merged: "{{ jenkins_agent_daemon_existing | combine(jenkins_agent_docker_daemon, recursive=true) }}"

- name: Write /etc/docker/daemon.json when it would change
  ansible.builtin.include_tasks: guest_file.yml
  vars:
    gf_dest: /etc/docker/daemon.json
    gf_content: "{{ jenkins_agent_daemon_merged | to_nice_json }}\n"
    gf_mode: "0644"
    gf_changed_var: jenkins_agent_daemon_changed
  when: jenkins_agent_daemon_merged != jenkins_agent_daemon_existing

- name: Restart docker to apply new daemon.json
  ansible.builtin.command:
    argv: [qm, guest, exec, "{{ jenkins_agent_vmid }}", "--timeout", "90", "--", /bin/systemctl, restart, docker]
  register: jenkins_agent_docker_restart
  changed_when: true
  failed_when: jenkins_agent_docker_restart.rc != 0 or (jenkins_agent_docker_restart.stdout | from_json).exitcode | default(1) != 0
  when: jenkins_agent_daemon_changed | default(false)

# --- 2. periodic image GC via systemd timer ---------------------------------

- name: Install docker-gc script
  ansible.builtin.include_tasks: guest_file.yml
  vars:
    gf_dest: "{{ jenkins_agent_gc_script }}"
    gf_content: "{{ lookup('ansible.builtin.file', 'docker-gc.sh') }}\n"
    gf_mode: "0755"
    gf_changed_var: jenkins_agent_units_changed

- name: Install docker-gc environment file
  ansible.builtin.include_tasks: guest_file.yml
  vars:
    gf_dest: "{{ jenkins_agent_gc_env_file }}"
    gf_content: "{{ lookup('ansible.builtin.template', 'docker-gc.env.j2') }}"
    gf_mode: "0644"
    gf_changed_var: jenkins_agent_units_changed

- name: Install docker-gc systemd service
  ansible.builtin.include_tasks: guest_file.yml
  vars:
    gf_dest: /etc/systemd/system/docker-gc.service
    gf_content: "{{ lookup('ansible.builtin.template', 'docker-gc.service.j2') }}"
    gf_mode: "0644"
    gf_changed_var: jenkins_agent_units_changed

- name: Install docker-gc systemd timer
  ansible.builtin.include_tasks: guest_file.yml
  vars:
    gf_dest: /etc/systemd/system/docker-gc.timer
    gf_content: "{{ lookup('ansible.builtin.template', 'docker-gc.timer.j2') }}"
    gf_mode: "0644"
    gf_changed_var: jenkins_agent_units_changed

- name: Reload systemd after unit changes
  ansible.builtin.command:
    argv: [qm, guest, exec, "{{ jenkins_agent_vmid }}", "--", /bin/systemctl, daemon-reload]
  register: jenkins_agent_daemon_reload
  changed_when: true
  failed_when: jenkins_agent_daemon_reload.rc != 0 or (jenkins_agent_daemon_reload.stdout | from_json).exitcode | default(1) != 0
  when: jenkins_agent_units_changed | default(false)

- name: Enable and start docker-gc timer
  ansible.builtin.command:
    argv: [qm, guest, exec, "{{ jenkins_agent_vmid }}", "--", /bin/systemctl, enable, --now, docker-gc.timer]
  register: jenkins_agent_timer_enable
  changed_when: "'Created symlink' in ((jenkins_agent_timer_enable.stdout | from_json)['err-data'] | default('') ~ (jenkins_agent_timer_enable.stdout | from_json)['out-data'] | default(''))"
  failed_when: jenkins_agent_timer_enable.rc != 0 or (jenkins_agent_timer_enable.stdout | from_json).exitcode | default(1) != 0

- name: Run docker-gc once now (optional)
  ansible.builtin.command:
    argv: [qm, guest, exec, "{{ jenkins_agent_vmid }}", "--timeout", "300", "--", /bin/systemctl, start, docker-gc.service]
  register: jenkins_agent_gc_now
  changed_when: true
  failed_when: jenkins_agent_gc_now.rc != 0 or (jenkins_agent_gc_now.stdout | from_json).exitcode | default(1) != 0
  when: jenkins_agent_gc_run_now | bool

# --- 3. inbound (JNLP) agent under systemd ----------------------------------
# Without a supervisor the hand-launched agent dies on reboot/controller
# restart. Run it as a service so it auto-starts and reconnects.

- name: Require the agent secret when managing the agent service
  ansible.builtin.assert:
    that:
      - jenkins_agent_secret | length > 0
    fail_msg: >-
      jenkins_agent_secret is empty. Put the JNLP secret for {{ jenkins_agent_name }}
      (Manage Jenkins > Nodes > {{ jenkins_agent_name }}) into secrets.yml.
  when: jenkins_agent_manage_service | bool

- name: Install the agent secret env file
  ansible.builtin.include_tasks: guest_file.yml
  vars:
    gf_dest: "{{ jenkins_agent_env_file }}"
    gf_content: "JENKINS_AGENT_SECRET={{ jenkins_agent_secret }}\n"
    gf_mode: "0600"
    gf_changed_var: jenkins_agent_svc_changed
  when: jenkins_agent_manage_service | bool

- name: Install the jenkins-agent systemd service
  ansible.builtin.include_tasks: guest_file.yml
  vars:
    gf_dest: /etc/systemd/system/jenkins-agent.service
    gf_content: "{{ lookup('ansible.builtin.template', 'jenkins-agent.service.j2') }}"
    gf_mode: "0644"
    gf_changed_var: jenkins_agent_svc_changed
  when: jenkins_agent_manage_service | bool

- name: Reload systemd after agent unit change
  ansible.builtin.command:
    argv: [qm, guest, exec, "{{ jenkins_agent_vmid }}", "--", /bin/systemctl, daemon-reload]
  register: jenkins_agent_svc_reload
  changed_when: true
  failed_when: jenkins_agent_svc_reload.rc != 0 or (jenkins_agent_svc_reload.stdout | from_json).exitcode | default(1) != 0
  when: jenkins_agent_manage_service | bool and (jenkins_agent_svc_changed | default(false))

- name: Enable and start the jenkins-agent service
  ansible.builtin.command:
    argv: [qm, guest, exec, "{{ jenkins_agent_vmid }}", "--", /bin/systemctl, enable, --now, jenkins-agent.service]
  register: jenkins_agent_svc_enable
  changed_when: "'Created symlink' in ((jenkins_agent_svc_enable.stdout | from_json)['err-data'] | default('') ~ (jenkins_agent_svc_enable.stdout | from_json)['out-data'] | default(''))"
  failed_when: jenkins_agent_svc_enable.rc != 0 or (jenkins_agent_svc_enable.stdout | from_json).exitcode | default(1) != 0
  when: jenkins_agent_manage_service | bool

- name: Restart the jenkins-agent service to apply changes
  ansible.builtin.command:
    argv: [qm, guest, exec, "{{ jenkins_agent_vmid }}", "--timeout", "30", "--", /bin/systemctl, restart, jenkins-agent.service]
  register: jenkins_agent_svc_restart
  changed_when: true
  failed_when: jenkins_agent_svc_restart.rc != 0 or (jenkins_agent_svc_restart.stdout | from_json).exitcode | default(1) != 0
  when: jenkins_agent_manage_service | bool and (jenkins_agent_svc_changed | default(false))

# --- 4. deploy tooling (kubectl + helm) -------------------------------------
# The Helm deploy stages run their shell on this agent, so `kubectl` and `helm`
# have to exist here or the stage dies with "command not found". Both are
# installed as pinned release binaries with their published sha256 checked
# before install. The guest prints "installed" or "unchanged", which is what
# drives changed_when, so a re-run of the role is a no-op.

- name: Install kubectl on the agent
  ansible.builtin.command:
    argv:
      - qm
      - guest
      - exec
      - "{{ jenkins_agent_vmid }}"
      - "--timeout"
      - "300"
      - "--"
      - /bin/sh
      - "-c"
      - |
        set -e
        if {{ jenkins_agent_kubectl_bin }} version --client 2>/dev/null | grep -q "{{ jenkins_agent_kubectl_version }}"; then
          echo unchanged
          exit 0
        fi
        url="https://dl.k8s.io/release/{{ jenkins_agent_kubectl_version }}/bin/linux/{{ jenkins_agent_tools_arch }}/kubectl"
        curl -fsSL -o /tmp/kubectl "$url"
        curl -fsSL -o /tmp/kubectl.sha256 "$url.sha256"
        echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum -c -
        install -m 0755 /tmp/kubectl {{ jenkins_agent_kubectl_bin }}
        rm -f /tmp/kubectl /tmp/kubectl.sha256
        echo installed
  register: jenkins_agent_kubectl_install
  changed_when: "'installed' in ((jenkins_agent_kubectl_install.stdout | from_json)['out-data'] | default(''))"
  failed_when: jenkins_agent_kubectl_install.rc != 0 or (jenkins_agent_kubectl_install.stdout | from_json).exitcode | default(1) != 0
  when: jenkins_agent_manage_deploy_tools | bool

- name: Install helm on the agent
  ansible.builtin.command:
    argv:
      - qm
      - guest
      - exec
      - "{{ jenkins_agent_vmid }}"
      - "--timeout"
      - "300"
      - "--"
      - /bin/sh
      - "-c"
      - |
        set -e
        if {{ jenkins_agent_helm_bin }} version --short 2>/dev/null | grep -q "{{ jenkins_agent_helm_version }}"; then
          echo unchanged
          exit 0
        fi
        url="https://get.helm.sh/helm-{{ jenkins_agent_helm_version }}-linux-{{ jenkins_agent_tools_arch }}.tar.gz"
        curl -fsSL -o /tmp/helm.tgz "$url"
        curl -fsSL -o /tmp/helm.tgz.sha256 "$url.sha256"
        echo "$(cat /tmp/helm.tgz.sha256)  /tmp/helm.tgz" | sha256sum -c -
        rm -rf /tmp/helm-unpack
        mkdir -p /tmp/helm-unpack
        tar -xzf /tmp/helm.tgz -C /tmp/helm-unpack
        install -m 0755 /tmp/helm-unpack/linux-{{ jenkins_agent_tools_arch }}/helm {{ jenkins_agent_helm_bin }}
        rm -rf /tmp/helm.tgz /tmp/helm.tgz.sha256 /tmp/helm-unpack
        echo installed
  register: jenkins_agent_helm_install
  changed_when: "'installed' in ((jenkins_agent_helm_install.stdout | from_json)['out-data'] | default(''))"
  failed_when: jenkins_agent_helm_install.rc != 0 or (jenkins_agent_helm_install.stdout | from_json).exitcode | default(1) != 0
  when: jenkins_agent_manage_deploy_tools | bool
