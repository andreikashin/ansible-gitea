---
# Ночные задания vzdump на ноде Proxmox.
#
# Список задаётся в host_vars каждой ноды: что бэкапить, решает не роль, а
# инвентарь. Пусто по умолчанию, потому что ноды без ценных гестов (стенд,
# нода с воспроизводимым инференсом) не должны получать расписание случайно.
#
# Формат элемента:
#   - comment:  стабильное имя, по нему же роль ищет уже существующее задание
#     vmid:     "20070" или "10064,20063"
#     schedule: календарь systemd, "01:00" или "sun 03:30"
pve_backup_jobs: []

pve_backup_storage: pbs

# snapshot, а не stop: гесты продолжают работать. Для баз это crash-consistent
# копия, поэтому поверх ещё делаются логические дампы (§11.6 плана).
pve_backup_mode: snapshot
