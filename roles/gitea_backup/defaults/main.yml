---
# Бэкап Gitea в два уровня, потому что они защищают от разного.
#
#   db    Копия SQLite штатным онлайн-бэкапом. Несколько мегабайт, снимается
#         мгновенно и без остановки сервиса. Внутри всё, чего нет больше нигде:
#         issues, пользователи, токены, вебхуки, настройки организаций.
#         Репозиториев здесь НЕТ, они лежат файлами рядом.
#
#   full  gitea dump: база в виде SQL, репозитории, конфиг и аватары одним
#         архивом. Артефакт полного восстановления, но на порядок тяжелее,
#         поэтому раз в сутки.
#
# Обычный cp файла gitea.db не годится: SQLite пишет страницами, и копия,
# снятая во время записи, приезжает разорванной посередине транзакции.

gitea_backup_container: gitea
gitea_backup_db_path: /data/gitea/gitea.db
gitea_backup_docker: /usr/bin/docker
gitea_backup_bin: /usr/local/bin/gitea-backup
gitea_backup_config_dir: /etc/gitea-backup

# Каталоги РАЗНЫЕ намеренно. Мониторинг смотрит на возраст свежего файла в
# каталоге, и если сложить уровни вместе, шестичасовые копии базы будут вечно
# освежать каталог и замаскируют застрявший суточный дамп.
gitea_backup_dest_db: /var/backups/gitea-db
gitea_backup_dest_full: /var/backups/gitea-full

# 56 копий по шесть часов это 14 дней, 14 полных архивов это те же две недели.
gitea_backup_keep_db: 56
gitea_backup_keep_full: 14

# :20 смещено относительно pg-dump, чтобы задачи не лезли на диск разом.
gitea_backup_oncalendar_db: '*-*-* 00,06,12,18:20:00'
gitea_backup_oncalendar_full: '*-*-* 01:20:00'
