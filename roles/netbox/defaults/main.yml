---
netbox_install_dir: /opt/netbox

# Версия образа netbox-docker. Держим не самую свежую ветку, а предыдущую
# стабильную: у NetBox миграции схемы идут при каждом обновлении, и первые
# патчи мажорной версии исторически их и правят. Обновление это смена одной
# строки плюс перезапуск, откат стоит дороже.
netbox_image: netboxcommunity/netbox:v4.6.10-5.0.2
netbox_redis_image: redis:7-alpine

netbox_port: 8080

# Окно, в течение которого проверка здоровья не считается провалом. Нужно
# пережить первый запуск с миграциями на пустой базе, см. compose.yml.j2.
netbox_health_start_period: 1800s

# База внешняя, на дата-тире. Локальную не заводим сознательно: приложения в
# лабе уже съезжаются на общий PostgreSQL, и заводить NetBox отдельно значит
# сразу записать его в тот же долг миграции.
netbox_db_name: netbox
netbox_db_user: netbox
netbox_db_port: 5432

# Redis у NetBox два логических: очередь задач и кэш. Держим локально в госте,
# на дата-тир не тащим. Это производные данные, они восстанавливаются сами,
# бэкапить нечего, а лишний сетевой хоп на каждый запрос не нужен.
netbox_redis_db_tasks: 0
netbox_redis_db_cache: 1

netbox_superuser: admin
netbox_superuser_email: admin@example.lan

# Часовой пояс влияет на отметки времени в журнале изменений.
netbox_time_zone: Europe/Tallinn

# Сколько дней хранить журнал изменений. NetBox пишет туда каждую правку, и без
# ограничения таблица растёт бесконечно.
netbox_changelog_retention: 90

netbox_compose_project: netbox

# Как часто гонять уборку, в секундах. Раз в сутки: она чистит журнал изменений,
# протухшие сессии и старые задания, срочности в этом нет.
netbox_housekeeping_interval: 86400
