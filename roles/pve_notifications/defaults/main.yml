---
# Уведомления Proxmox в Telegram через webhook.
#
# По умолчанию нода шлёт всё в mail-to-root, то есть в локальный ящик, который
# никто не читает. Упавший ночной бэкап так и остаётся незамеченным до того дня,
# когда бэкап понадобится. Это ровно тот отказ, который тише всех и дороже всех.
#
# Бот переиспользуется тот же, что у продуктового бота: заводить второго ради
# одного оператора незачем.

pve_notify_endpoint_name: telegram
pve_notify_matcher_name: telegram-problems

# Только проблемы. По умолчанию Proxmox шлёт уведомление на КАЖДЫЙ бэкап,
# включая успешный, а это самый короткий путь к тому, чтобы канал замьютили и
# перестали читать.
pve_notify_severities: 'warning,error'

# Заданы в host_vars или group_vars. Не заданы - роль ничего не делает.
# pve_notify_telegram_token: ...
# pve_notify_telegram_chat_id: ...
