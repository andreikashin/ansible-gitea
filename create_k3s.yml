---
# Создание гестов под кластер k3s клонированием облачного шаблона Ubuntu.
#
# Отдельно от deploy_k3s.yml по той же причине, что и у остальных пар create/deploy:
# создание гестов это операция на ноде Proxmox, а установка k3s идёт уже внутрь
# гестов по SSH. Разные hosts, в один play не сходятся.
#
# Сколько нод и какие адреса, плейбук не решает: он разворачивает ровно то, что
# описано в inventory.ini и host_vars. Хочешь HA из трёх серверов, добавь два
# хоста в [k3s_server_group], всё остальное сойдётся само.
#
# Ключ. В шаблоне может лежать чужой публичный ключ, к которому у управляющей
# машины нет пары, поэтому свой ключ прописываем при клонировании, а не
# надеемся на содержимое шаблона.
#
# Шаблона на ноде может не быть вовсе: они не общие, каждая нода Proxmox стоит
# отдельно. Поэтому при отсутствии шаблон собирается из официального облачного
# образа Ubuntu, аналогично тому, как это делает deploy_vault.yml для Debian.
# Так плейбук одинаково работает и на обжитой ноде, и на только что
# переустановленной.
#
# Запуск:
#   ansible-playbook -i inventory.ini create_k3s.yml
#   ansible-playbook -i inventory.ini create_k3s.yml -e k3s_ssh_pubkey_file=~/.ssh/other.pub

- name: Provision the k3s guests on Proxmox
  # hostvars в поле hosts не раскрываются, поэтому нода задаётся переменной, а
  # совпадение с host_vars проверяется первой же задачей.
  hosts: "{{ k3s_pve_target | default('pve2') }}"
  become: true
  gather_facts: false
  vars:
    k3s_ssh_pubkey_file: "~/.ssh/id_rsa.pub"
    # Держим список именами хостов, а не выжимкой hostvars целиком. Целиком
    # нельзя: этот плей идёт на ноде Proxmox, которая в группу кластера не
    # входит, и групповые переменные кластера в её контексте не раскрываются.
    k3s_nodes: "{{ groups['k3s_cluster'] }}"
    k3s_template_vmid: "{{ hostvars[k3s_nodes | first].k3s_template_vmid }}"
    k3s_template_name: u24s-cloud-tmpl
    k3s_template_autobuild: true
    k3s_bridge: vmbr0
    k3s_cloud_image_url: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
    k3s_cloud_image_path: "/var/lib/vz/template/iso/{{ k3s_cloud_image_url | basename }}"

  tasks:
    # Все ноды кластера должны ехать на одну ноду Proxmox: этот плейбук работает
    # с одним хостом, и молча разложить половину гестов мимо он не должен.
    - name: Fail if the nodes disagree about the target host
      vars:
        k3s_targets: "{{ k3s_nodes | map('extract', hostvars, 'k3s_pve_target') | list }}"
      assert:
        that:
          - k3s_targets | unique | length == 1
          - k3s_targets | first == inventory_hostname
        fail_msg: >-
          host_vars просят {{ k3s_targets | unique | join(', ') }},
          а плейбук идёт на {{ inventory_hostname }}. Кластер разворачивается на одной ноде,
          передай нужную через -e k3s_pve_target=...
        quiet: true

    - name: Check whether the source template exists
      command: "qm config {{ k3s_template_vmid }}"
      register: k3s_tmpl
      changed_when: false
      failed_when: false

    - name: Fail if the template is missing and autobuild is off
      assert:
        that: k3s_tmpl.rc == 0 or (k3s_template_autobuild | bool)
        fail_msg: >-
          Шаблона {{ k3s_template_vmid }} на {{ inventory_hostname }} нет, а
          k3s_template_autobuild=false. Либо создай шаблон, либо включи сборку.
        quiet: true

    # Тот же приём, что "docker pull" для базового образа: тянем официальный
    # облачный образ и превращаем его в шаблон. Облачный, а не установочный
    # ISO, потому что без cloud-init гест не примет ни статику, ни ключ.
    - name: Build the cloud-init template from the official image
      when:
        - k3s_tmpl.rc != 0
        - k3s_template_autobuild | bool
      block:
        - name: Download the Ubuntu cloud image
          get_url:
            url: "{{ k3s_cloud_image_url }}"
            dest: "{{ k3s_cloud_image_path }}"
            mode: '0644'

        - name: Create the template VM shell
          command: >-
            qm create {{ k3s_template_vmid }} --name {{ k3s_template_name }}
            --memory 2048 --cores 2 --cpu host
            --net0 virtio,bridge={{ k3s_bridge }}
            --scsihw virtio-scsi-single --ostype l26 --agent 1

        - name: Import the cloud image as the boot disk
          command: >-
            qm set {{ k3s_template_vmid }}
            --scsi0 {{ hostvars[k3s_nodes | first].k3s_storage }}:0,import-from={{ k3s_cloud_image_path }}

        - name: Attach the cloud-init drive, boot order and serial console
          command: >-
            qm set {{ k3s_template_vmid }}
            --ide2 {{ hostvars[k3s_nodes | first].k3s_storage }}:cloudinit
            --boot order=scsi0 --serial0 socket --vga serial0

        - name: Convert the VM into a template
          command: "qm template {{ k3s_template_vmid }}"

    - name: Re-read the template config
      command: "qm config {{ k3s_template_vmid }}"
      register: k3s_tmpl_final
      changed_when: false

    - name: Fail if the source is not a template
      assert:
        that: "'template: 1' in k3s_tmpl_final.stdout"
        fail_msg: >-
          VMID {{ k3s_template_vmid }} на {{ inventory_hostname }} не является шаблоном.
        quiet: true

    - name: Check which target VMIDs are already taken
      command: "qm config {{ hostvars[item].k3s_vmid }}"
      loop: "{{ k3s_nodes }}"
      loop_control:
        label: "{{ hostvars[item].k3s_vmid }} {{ hostvars[item].k3s_vm_name }}"
      register: k3s_existing
      changed_when: false
      failed_when: false

    # Занятый VMID не перезаписываем никогда. Для кластера это особенно важно:
    # старый и новый инстансы легко перепутать, а на том конце может стоять
    # работающая нода с рабочими нагрузками.
    - name: Check that the target addresses are not answering already
      command: "ping -c 2 -W 1 {{ hostvars[item.item].k3s_ip }}"
      loop: "{{ k3s_existing.results }}"
      loop_control:
        label: "{{ hostvars[item.item].k3s_ip }}"
      register: k3s_ping
      changed_when: false
      failed_when: false
      when: item.rc != 0

    - name: Fail if an address is taken by something else
      assert:
        that: item.rc != 0
        fail_msg: >-
          {{ hostvars[item.item.item].k3s_ip }} отвечает на ping, а геста
          {{ hostvars[item.item.item].k3s_vmid }} ещё нет. Октет занят кем-то другим.
        quiet: true
      loop: "{{ k3s_ping.results }}"
      loop_control:
        label: "{{ item.item.item | default('skipped') }}"
      when: not (item.skipped | default(false))

    - name: Put the control node public key where qm can read it
      copy:
        content: "{{ lookup('file', k3s_ssh_pubkey_file) }}\n"
        dest: /tmp/ansible-k3s.pub
        mode: '0600'

    - name: Clone the template
      command:
        argv:
          - qm
          - clone
          - "{{ k3s_template_vmid }}"
          - "{{ hostvars[item.item].k3s_vmid }}"
          - --name
          - "{{ hostvars[item.item].k3s_vm_name }}"
          - --full
          - "1"
          - --storage
          - "{{ hostvars[item.item].k3s_storage }}"
      loop: "{{ k3s_existing.results }}"
      loop_control:
        label: "{{ hostvars[item.item].k3s_vm_name }}"
      when: item.rc != 0

    - name: Apply resources, addressing and the ssh key
      command:
        argv:
          - qm
          - set
          - "{{ hostvars[item.item].k3s_vmid }}"
          - --cores
          - "{{ hostvars[item.item].k3s_cores }}"
          - --sockets
          - "1"
          - --memory
          - "{{ hostvars[item.item].k3s_memory }}"
          - --onboot
          - "1"
          - --agent
          - "1"
          - --ciuser
          - "{{ hostvars[item.item].ansible_user }}"
          - --sshkeys
          - /tmp/ansible-k3s.pub
          - --ipconfig0
          - "ip={{ hostvars[item.item].k3s_ip }}/{{ hostvars[item.item].k3s_cidr }},gw={{ hostvars[item.item].k3s_gateway }}"
          - --nameserver
          - "{{ hostvars[item.item].k3s_nameserver }}"
      loop: "{{ k3s_existing.results }}"
      loop_control:
        label: "{{ hostvars[item.item].k3s_vm_name }}"
      when: item.rc != 0

    - name: Grow the root disk
      command: "qm resize {{ hostvars[item.item].k3s_vmid }} scsi0 +{{ hostvars[item.item].k3s_disk_grow }}"
      loop: "{{ k3s_existing.results }}"
      loop_control:
        label: "{{ hostvars[item.item].k3s_vm_name }}"
      when: item.rc != 0

    - name: Start the guests
      command: "qm start {{ hostvars[item].k3s_vmid }}"
      loop: "{{ k3s_nodes }}"
      loop_control:
        label: "{{ hostvars[item].k3s_vm_name }}"
      register: k3s_start
      changed_when: "'already running' not in k3s_start.stderr"
      failed_when: k3s_start.rc != 0 and 'already running' not in k3s_start.stderr

    - name: Wait for SSH on the new guests
      wait_for:
        host: "{{ hostvars[item].k3s_ip }}"
        port: 22
        timeout: 300
      loop: "{{ k3s_nodes }}"
      loop_control:
        label: "{{ hostvars[item].k3s_ip }}"
      delegate_to: localhost
      become: false

    - name: Report
      debug:
        msg: >-
          {{ k3s_nodes | map('extract', hostvars, 'k3s_vm_name') | join(', ') }} на
          {{ inventory_hostname }}. Дальше: ansible-playbook -i inventory.ini deploy_k3s.yml
