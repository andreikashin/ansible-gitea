---
# Publish the k3s kubeconfig into Jenkins as the secret-file credential the
# deploy stages consume with withCredentials([file(credentialsId: ...)]).
# Without it a pipeline fails before running anything, with
# "Could not find credentials entry with ID 'k3s-kubeconfig'".
#
# Mirrors connect_ip_rotation_release_credentials_to_jenkins.yml: stage the file
# on the PVE node, push it into the Jenkins CT, let a one-time init.groovy.d
# script turn it into a FileCredentialsImpl, then delete both leftovers.
#
# The kubeconfig is read straight off the first k3s server and the loopback
# address k3s writes into it is rewritten to that server's real API endpoint,
# the same rewrite deploy_k3s.yml does for the control node copy.
- name: Connect the k3s kubeconfig to Jenkins
  hosts: "{{ jenkins_pve_target | default('pve1') }}"
  become: yes
  gather_facts: false
  vars_files:
    - secrets.yml
  vars:
    jenkins_inventory_host: "{{ groups['jenkins_group'] | first }}"
    jenkins_inventory_vars: "{{ hostvars[jenkins_inventory_host] }}"
    jenkins_ctid: "{{ jenkins_inventory_vars.jenkins_ctid }}"
    # group_vars/jenkins_group.yml applies to the Jenkins host, not to the PVE
    # host this play targets, so the Jenkins settings come through hostvars.
    jenkins_install_dir: "{{ jenkins_inventory_vars.jenkins_install_dir }}"
    jenkins_http_port: "{{ jenkins_inventory_vars.jenkins_http_port }}"
    jenkins_credentials_file: "{{ jenkins_install_dir }}/data/credentials.xml"
    jenkins_k3s_kubeconfig_credentials_id: "{{ jenkins_inventory_vars.jenkins_k3s_kubeconfig_credentials_id }}"
    jenkins_k3s_kubeconfig_credentials_description: "{{ jenkins_inventory_vars.jenkins_k3s_kubeconfig_credentials_description }}"
    # Where the kubeconfig is read from.
    k3s_source_host: "{{ groups['k3s_server_group'] | first }}"
    k3s_source_vars: "{{ hostvars[k3s_source_host] }}"
    k3s_api_url: "https://{{ k3s_source_vars.ansible_host }}:{{ k3s_source_vars.k3s_api_port }}"
    # Paths inside the Jenkins CT.
    k3s_kubeconfig_ct_dir: "{{ jenkins_install_dir }}/data/k3s-kubeconfig-bootstrap"
    k3s_kubeconfig_ct_path: "{{ k3s_kubeconfig_ct_dir }}/kubeconfig"
    k3s_kubeconfig_script_ct: "{{ jenkins_install_dir }}/data/init.groovy.d/60-k3s-kubeconfig.groovy"
    # How that bootstrap directory is seen from inside the Jenkins container.
    k3s_kubeconfig_container_dir: /var/jenkins_home/k3s-kubeconfig-bootstrap
    # Staging paths on the PVE node before pushing into the CT.
    k3s_kubeconfig_stage_pve: /tmp/k3s-kubeconfig
    k3s_kubeconfig_script_stage_pve: /tmp/60-k3s-kubeconfig.groovy
  pre_tasks:
    - name: Validate the kubeconfig credential settings
      assert:
        that:
          - jenkins_k3s_kubeconfig_credentials_id is defined
          - jenkins_k3s_kubeconfig_credentials_id | length > 0
        fail_msg: >-
          Set jenkins_k3s_kubeconfig_credentials_id before running this playbook.
          It has to match the credentialsId the pipelines ask for.

    - name: Read the kubeconfig from the k3s server
      delegate_to: "{{ k3s_source_host }}"
      become: false
      slurp:
        src: "{{ k3s_source_vars.k3s_kubeconfig_path }}"
      register: k3s_kubeconfig_slurp
      no_log: true

    - name: Point the kubeconfig at the reachable API address
      # k3s writes 127.0.0.1 in there, which means nothing on the build agent.
      set_fact:
        k3s_kubeconfig_content: >-
          {{ k3s_kubeconfig_slurp.content | b64decode
             | replace('https://127.0.0.1:' ~ k3s_source_vars.k3s_api_port, k3s_api_url) }}
      no_log: true

    - name: Fail when the rewritten kubeconfig is not usable off-node
      assert:
        that:
          - "'apiVersion' in k3s_kubeconfig_content"
          - "'127.0.0.1' not in k3s_kubeconfig_content"
        fail_msg: >-
          The kubeconfig read from {{ k3s_source_host }} still points at the
          loopback address or is not a kubeconfig at all.

    - name: Ensure the Jenkins init and bootstrap directories exist inside the CT
      command: >-
        pct exec {{ jenkins_ctid }} --
        bash -lc 'mkdir -p {{ jenkins_install_dir }}/data/init.groovy.d {{ k3s_kubeconfig_ct_dir }}
        && chmod 700 {{ k3s_kubeconfig_ct_dir }}'
      changed_when: false

    - name: Stage the kubeconfig on the PVE node
      copy:
        content: "{{ k3s_kubeconfig_content }}"
        dest: "{{ k3s_kubeconfig_stage_pve }}"
        mode: "0600"
      no_log: true

    - name: Push the kubeconfig into the Jenkins CT
      command: >-
        pct push {{ jenkins_ctid }}
        {{ k3s_kubeconfig_stage_pve }}
        {{ k3s_kubeconfig_ct_path }}
        --perms 0600

    - name: Render the kubeconfig credential bootstrap script on the PVE node
      template:
        src: roles/jenkins/templates/init.groovy.d/60-k3s-kubeconfig.groovy.j2
        dest: "{{ k3s_kubeconfig_script_stage_pve }}"
        mode: "0600"

    - name: Push the kubeconfig credential bootstrap script into the Jenkins CT
      command: >-
        pct push {{ jenkins_ctid }}
        {{ k3s_kubeconfig_script_stage_pve }}
        {{ k3s_kubeconfig_script_ct }}
        --perms 0644

    - name: Remove the staged kubeconfig artifacts from the PVE node
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ k3s_kubeconfig_stage_pve }}"
        - "{{ k3s_kubeconfig_script_stage_pve }}"

    - name: Restart Jenkins so the kubeconfig credential bootstrap is applied
      command: >-
        pct exec {{ jenkins_ctid }} --
        bash -lc 'cd {{ jenkins_install_dir }} && docker compose restart jenkins'

    - name: Wait for Jenkins HTTP to come back
      wait_for:
        host: "{{ jenkins_inventory_vars.jenkins_ct_ip }}"
        port: "{{ jenkins_http_port }}"
        timeout: 300

    - name: Wait for the kubeconfig credential to appear in Jenkins
      command: >-
        pct exec {{ jenkins_ctid }} --
        grep -q "<id>{{ jenkins_k3s_kubeconfig_credentials_id }}</id>" {{ jenkins_credentials_file }}
      register: k3s_kubeconfig_credential_ready
      retries: 30
      delay: 2
      until: k3s_kubeconfig_credential_ready.rc == 0
      changed_when: false

    - name: Remove the staged kubeconfig from the CT
      command: >-
        pct exec {{ jenkins_ctid }} --
        rm -rf {{ k3s_kubeconfig_ct_dir }}
      changed_when: true

    - name: Remove the one-time kubeconfig bootstrap script from the CT
      command: >-
        pct exec {{ jenkins_ctid }} --
        rm -f {{ k3s_kubeconfig_script_ct }}
      changed_when: true

  tasks:
    - name: Confirm the kubeconfig credential exists in Jenkins
      command: >-
        pct exec {{ jenkins_ctid }} --
        grep -q "<id>{{ jenkins_k3s_kubeconfig_credentials_id }}</id>" {{ jenkins_credentials_file }}
      changed_when: false
