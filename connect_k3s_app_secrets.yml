---
# Materialise application secrets in the k3s cluster from the values this repo
# already holds, so nothing is typed into the cluster by hand and a rebuilt
# cluster is refilled by rerunning this playbook.
#
# What to create is described by k3s_app_secrets in the gitignored host_vars of
# the k3s server, so neither a project name nor a credential appears in this
# file. Shape:
#
#   k3s_app_secrets:
#     - namespace: <namespace>
#       name: <secret name>
#       data:
#         SOME_KEY: "{{ a_var_from_secrets_yml_or_other_host_vars }}"
#
# Values are referenced, not copied: point them at the variable that already
# holds the password (secrets.yml, or another host's host_vars) instead of
# pasting it a second time.
#
# Every task that touches a value runs with no_log, so nothing lands in the
# ansible output.
- name: Materialise application secrets in the k3s cluster
  hosts: "{{ k3s_secrets_target | default(groups['k3s_server_group'] | first) }}"
  become: false
  gather_facts: false
  vars_files:
    - secrets.yml

  tasks:
    - name: Require the secret inventory
      ansible.builtin.assert:
        that:
          - k3s_app_secrets is defined
          - k3s_app_secrets | length > 0
        fail_msg: >-
          k3s_app_secrets is not defined. Describe the secrets in the gitignored
          host_vars of the k3s server, see the header of this playbook.

    - name: Ensure the namespaces exist
      ansible.builtin.shell:
        cmd: kubectl create namespace {{ item }} --dry-run=client -o yaml | kubectl apply -f -
      loop: "{{ k3s_app_secrets | map(attribute='namespace') | unique | list }}"
      register: k3s_namespace_apply
      changed_when: "'created' in k3s_namespace_apply.stdout"

    # kubectl apply rather than create, so a rerun updates an existing secret
    # instead of failing on AlreadyExists. The manifest is streamed on stdin and
    # never written to disk on the node.
    - name: Apply the secrets
      ansible.builtin.shell:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: {{ item.name }}
            namespace: {{ item.namespace }}
          type: Opaque
          stringData:
          {% for key, value in item.data.items() %}
            {{ key }}: {{ value | to_json }}
          {% endfor %}
      loop: "{{ k3s_app_secrets }}"
      loop_control:
        label: "{{ item.namespace }}/{{ item.name }}"
      no_log: true
      register: k3s_secret_apply
      changed_when: >-
        'created' in (k3s_secret_apply.stdout | default(''))
        or 'configured' in (k3s_secret_apply.stdout | default(''))

    - name: Confirm the secrets exist
      ansible.builtin.command:
        argv: [kubectl, -n, "{{ item.namespace }}", get, secret, "{{ item.name }}", -o, name]
      loop: "{{ k3s_app_secrets }}"
      loop_control:
        label: "{{ item.namespace }}/{{ item.name }}"
      changed_when: false
