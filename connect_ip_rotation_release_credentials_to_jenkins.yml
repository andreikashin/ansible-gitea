---
- name: Connect IP Rotation release credentials to Jenkins
  hosts: "{{ jenkins_pve_target | default('pve1') }}"
  become: yes
  gather_facts: false
  vars_files:
    - secrets.yml
  vars:
    ip_rotation_app_repo_dir: /mnt/c/Repos/ip-rotation/ip-rotation-app
    jenkins_inventory_host: "{{ groups['jenkins_group'] | first }}"
    jenkins_inventory_vars: "{{ hostvars[jenkins_inventory_host] }}"
    jenkins_ctid: "{{ jenkins_inventory_vars.jenkins_ctid }}"
    jenkins_credentials_file: "{{ jenkins_install_dir }}/data/credentials.xml"
    # Paths inside the Jenkins CT.
    ip_rotation_credentials_ct_dir: "{{ jenkins_install_dir }}/data/ip-rotation-release-bootstrap"
    ip_rotation_release_keystore_ct_path: "{{ ip_rotation_credentials_ct_dir }}/release.keystore"
    ip_rotation_credentials_script_ct: "{{ jenkins_install_dir }}/data/init.groovy.d/30-ip-rotation-release-credentials.groovy"
    # How the bootstrap directory is seen from inside the Jenkins container.
    ip_rotation_credentials_container_dir: /var/jenkins_home/ip-rotation-release-bootstrap
    # Staging paths on the PVE node before pushing into the CT.
    ip_rotation_release_keystore_stage_pve: "/tmp/ip-rotation-release.keystore"
    ip_rotation_credentials_script_stage_pve: "/tmp/30-ip-rotation-release-credentials.groovy"
  pre_tasks:
    - name: Check that the IP Rotation app repo exists locally
      delegate_to: localhost
      become: false
      run_once: true
      stat:
        path: "{{ ip_rotation_app_repo_dir }}"
      register: ip_rotation_app_repo_stat

    - name: Fail when the IP Rotation app repo is missing
      assert:
        that:
          - ip_rotation_app_repo_stat.stat.exists
          - ip_rotation_app_repo_stat.stat.isdir
        fail_msg: >-
          Expected the IP Rotation app repo at {{ ip_rotation_app_repo_dir }}, but it was not found.

    - name: Discover the release keystore in the IP Rotation app repo
      delegate_to: localhost
      become: false
      run_once: true
      find:
        paths: "{{ ip_rotation_app_repo_dir }}"
        recurse: true
        file_type: file
        hidden: true
        patterns:
          - "*keystore*"
          - "*.jks"
      register: ip_rotation_release_keystore_find

    - name: Fail when the release keystore is missing or ambiguous
      assert:
        that:
          - ip_rotation_release_keystore_find.matched == 1
        fail_msg: >-
          Expected exactly one release keystore under {{ ip_rotation_app_repo_dir }},
          but found {{ ip_rotation_release_keystore_find.matched }}.

    - name: Select the discovered release artifact paths
      set_fact:
        ip_rotation_release_keystore_path: "{{ ip_rotation_release_keystore_find.files[0].path }}"

    - name: Ensure the Jenkins init and bootstrap directories exist inside the CT
      command: >-
        pct exec {{ jenkins_ctid }} --
        bash -lc 'mkdir -p {{ jenkins_install_dir }}/data/init.groovy.d {{ ip_rotation_credentials_ct_dir }}
        && chmod 700 {{ ip_rotation_credentials_ct_dir }}'
      changed_when: false

    - name: Stage the release keystore on the PVE node
      copy:
        src: "{{ ip_rotation_release_keystore_path }}"
        dest: "{{ ip_rotation_release_keystore_stage_pve }}"
        mode: "0600"
      no_log: true

    - name: Push the release keystore into the Jenkins CT
      command: >-
        pct push {{ jenkins_ctid }}
        {{ ip_rotation_release_keystore_stage_pve }}
        {{ ip_rotation_release_keystore_ct_path }}
        --perms 0600

    - name: Render the IP Rotation credential bootstrap script on the PVE node
      template:
        src: roles/jenkins/templates/init.groovy.d/30-ip-rotation-release-credentials.groovy.j2
        dest: "{{ ip_rotation_credentials_script_stage_pve }}"
        mode: "0600"
      no_log: true

    - name: Push the IP Rotation credential bootstrap script into the Jenkins CT
      command: >-
        pct push {{ jenkins_ctid }}
        {{ ip_rotation_credentials_script_stage_pve }}
        {{ ip_rotation_credentials_script_ct }}
        --perms 0644

    - name: Remove the staged IP Rotation artifacts from the PVE node
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ ip_rotation_release_keystore_stage_pve }}"
        - "{{ ip_rotation_credentials_script_stage_pve }}"

    - name: Restart Jenkins so the IP Rotation credentials bootstrap is applied
      command: >-
        pct exec {{ jenkins_ctid }} --
        bash -lc 'cd {{ jenkins_install_dir }} && docker compose restart jenkins'

    - name: Wait for Jenkins HTTP to come back
      wait_for:
        host: "{{ jenkins_inventory_vars.jenkins_ct_ip }}"
        port: "{{ jenkins_http_port }}"
        timeout: 300

    - name: Wait for the IP Rotation release credentials to appear in Jenkins
      command: >-
        pct exec {{ jenkins_ctid }} --
        bash -lc 'grep -q "<id>{{ jenkins_ip_rotation_release_keystore_credentials_id }}</id>" {{ jenkins_credentials_file }}
        && grep -q "<id>{{ jenkins_ip_rotation_release_store_password_credentials_id }}</id>" {{ jenkins_credentials_file }}
        && grep -q "<id>{{ jenkins_ip_rotation_release_key_alias_credentials_id }}</id>" {{ jenkins_credentials_file }}'
      register: ip_rotation_credentials_ready
      retries: 30
      delay: 2
      until: ip_rotation_credentials_ready.rc == 0
      changed_when: false

    - name: Remove the staged release keystore from the CT
      command: >-
        pct exec {{ jenkins_ctid }} --
        rm -f {{ ip_rotation_release_keystore_ct_path }}
      changed_when: true

    - name: Remove the one-time IP Rotation credential bootstrap script from the CT
      command: >-
        pct exec {{ jenkins_ctid }} --
        rm -f {{ ip_rotation_credentials_script_ct }}
      changed_when: true

  tasks:
    - name: Confirm the IP Rotation release credentials exist in Jenkins
      command: >-
        pct exec {{ jenkins_ctid }} --
        grep -q "<id>{{ item }}</id>" {{ jenkins_credentials_file }}
      loop:
        - "{{ jenkins_ip_rotation_release_keystore_credentials_id }}"
        - "{{ jenkins_ip_rotation_release_store_password_credentials_id }}"
        - "{{ jenkins_ip_rotation_release_key_alias_credentials_id }}"
      changed_when: false
