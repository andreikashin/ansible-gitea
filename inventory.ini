[gitea_group]
gitea_node

[npm_group]
npm_node

[jenkins_group]
jenkins_node

[jenkins_agent_group]
jenkins_agent_node

[portainer_group]
portainer_node

[harbor_group]
harbor_node

[traefik_group]
traefik_node

[inference_gateway_group]
inference_gateway_node

[db_group]
db_tier_node

[pbs_group]
pbs_node

[observability_group]
observability_node

[mail_group]
mail_node

# Кластер k3s. Сервера и агенты держим разными группами: плейбук ставит их
# разными плеями, потому что агенту нужен токен, которого до старта первого
# сервера не существует.
[k3s_server_group]
k3s_server1

[k3s_agent_group]
k3s_agent1
k3s_agent2

[k3s_cluster:children]
k3s_server_group
k3s_agent_group

[minio_group]
minio_node

[pve_group]
pve1
pve2
pve3

# Ноды, которые НЕ участвуют в плейбуках бэкапа и клонирования, но с
# которых собираются метрики. Держим отдельной группой, чтобы охват
# pve_group не расширился молча.
[pve_extra]
pve5
pve7

[pve_all:children]
pve_group
pve_extra

[pve_group:vars]
ansible_user=root

# Сетевое железо. Подключение к ним не по SSH-ключу: свитч через network_cli,
# роутер через API, всё описано в host_vars.
[net_switch_group]
net_switch

[net_router_group]
net_router

[network_group:children]
net_switch_group
net_router_group

[all:vars]
ansible_ssh_private_key_file=~/.ssh/id_rsa