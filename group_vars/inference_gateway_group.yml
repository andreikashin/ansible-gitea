inference_gateway_install_dir: "/app/inference-gateway"

# Gateway takes the port Ollama would have used, so consumers change only the host.
inference_gateway_port: 11434
inference_gateway_bind: "0.0.0.0"
inference_gateway_log_level: "INFO"

inference_gateway_ollama_tag: "latest"

# ── Ollama runtime ────────────────────────────────────────
# -1 keeps models resident instead of unloading them after an idle period. With
# all three fitting at once there is nothing to reclaim by evicting one, and a
# reload only costs the next caller a cold start.
inference_gateway_keep_alive: "-1"

# How many models may hold VRAM simultaneously. Measured on the A4000 (16 GB):
# all three sit resident together at 13.1 GB with no swapping, each reported at
# 100% GPU by `ollama ps`. At 1, a request for a model that is not loaded evicts
# the resident one and stalls the other projects, so 3 both matches the host and
# removes cross-project eviction entirely.
inference_gateway_max_loaded_models: 3
inference_gateway_num_parallel: 1

# ── Models ────────────────────────────────────────────────
# Provisioned here rather than by whichever client asks first, which is also why
# the gateway exposes no /api/pull.
#
# qwen3 is the ceiling for a 16 GB card: the 3.5/3.6 releases either do not fit
# (27B) or do not yet run under Ollama (mmproj). The earlier qwen2.5 pair was
# deleted from the host, so listing it here would pull removed models back and
# leave two generations resident at once.
inference_gateway_models:
  - "qwen3:8b"          # text: llaima chat/router/extraction, semantiplex
  - "nomic-embed-text"  # embeddings: llaima RAG (768 dimensions)
  - "qwen3-vl:8b"       # vision: asynclair

# ── Routes: who may call what ─────────────────────────────
# `project` selects the key from inference_gateway_keys (gitignored host_vars).
# Adding a consumer is an edit here plus a key — the template needs no changes.
#
# Paths are an allowlist. Anything absent has no route, so the destructive
# endpoints stay unreachable by every key.
inference_gateway_routes:
  # llaima is split in two: RAG ingest issues one embedding request per chunk, so
  # a document of a few hundred chunks is a burst of a few hundred requests. A
  # limit sized for interactive traffic would break ingestion outright. This
  # ceiling can come down once llaima batches its embedding calls.
  - name: llaima-generate
    project: llaima
    rule: "Path(`/api/generate`) || Path(`/api/chat`)"
    rate_average: 60
    rate_burst: 20

  - name: llaima-embeddings
    project: llaima
    rule: "Path(`/api/embeddings`)"
    rate_average: 600
    rate_burst: 200

  - name: semantiplex-generate
    project: semantiplex
    rule: "Path(`/api/generate`) || Path(`/api/chat`)"
    rate_average: 60
    rate_burst: 20

  # asynclair speaks the OpenAI-compatible API and touches nothing else. Its SDK
  # sends the key as `Authorization: Bearer`, which is why the gateway accepts a
  # bearer token rather than basic auth — `api_key=<gateway key>` just works.
  - name: asynclair-openai
    project: asynclair
    rule: "PathPrefix(`/v1`)"
    rate_average: 60
    rate_burst: 20
