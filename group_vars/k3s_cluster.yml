---
# Общие настройки кластера k3s. Без секретов и без адресов: то и другое живёт в
# host_vars, которые не уезжают в репозиторий.

# Версия прибита гвоздями. Апгрейд кластера это отдельная операция со своим
# порядком (сначала сервера, потом агенты), а не побочный эффект прогона.
k3s_version: "v1.36.4+k3s1"
k3s_install_script_url: "https://get.k3s.io"

# Что выключаем из комплекта k3s.
#
# servicelb (klipper) выключен, потому что в лабе нет облачного балансировщика и
# сервисы типа LoadBalancer всё равно ходят через внешний traefik, который живёт
# отдельной ВМ вне кластера. Klipper в такой схеме только занимает порты на всех
# нодах и путает диагностику.
#
# traefik из комплекта оставлен включённым: это ingress-контроллер внутри
# кластера, и он не конфликтует с внешним, пока тот работает по NodePort.
# Если решишь оставить один ingress, добавь сюда traefik.
k3s_disable:
  - servicelb

# 644 нужен, чтобы kubectl работал не только из-под root. Файл всё равно лежит
# на самой ноде кластера, доступ к которой и так равен доступу к кластеру.
k3s_write_kubeconfig_mode: "644"
k3s_api_port: 6443

# Куда положить kubeconfig на управляющей машине. Адрес сервера в нём
# переписывается на адрес ноды, потому что k3s пишет туда 127.0.0.1.
k3s_kubeconfig_local: "~/.kube/lab-k3s.yaml"

k3s_server_extra_args: []
k3s_agent_extra_args: []

# Первый сервер в группе. Он инициализирует кластер, у него же все остальные
# берут токен, и его адрес попадает в kubeconfig. Живёт здесь, а не в defaults
# роли, потому что нужен и плею с проверкой, который роль не подключает.
k3s_first_server: "{{ groups['k3s_server_group'] | first }}"
k3s_server_url: >-
  https://{{ hostvars[k3s_first_server].ansible_host }}:{{ k3s_api_port }}

k3s_token_path: /var/lib/rancher/k3s/server/node-token
k3s_kubeconfig_path: /etc/rancher/k3s/k3s.yaml
