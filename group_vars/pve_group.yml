---
# Shared Proxmox VE backup settings for the pve_group inventory group.
# Sensitive local paths are not stored here.
# The per-host local backup folder is assembled from proxmox_backup_local_dir plus
# proxmox_backup_folder_name (or inventory_hostname if the folder name is not set).
proxmox_backup_remote_dir: /var/lib/vz/dump
proxmox_backup_host_dir: "{{ proxmox_backup_local_dir }}/{{ proxmox_backup_folder_name | default(inventory_hostname) }}"
proxmox_backup_mode: snapshot
proxmox_backup_compress: zstd
proxmox_backup_async_timeout: 86400
proxmox_backup_poll_interval: 30
proxmox_rsync_progress_interval: 10
proxmox_backup_config_items:
  - src: /etc/network/interfaces
    local_name: interfaces
  - src: /etc/pve/storage.cfg
    local_name: storage.cfg
  - src: /etc/hosts
    local_name: hosts
  - src: /etc/resolv.conf
    local_name: resolv.conf

# Full node configuration snapshot as a single tar.gz. Unlike the list above
# (individual human-readable files) this captures the whole /etc/pve — what you
# need to restore users/ACLs (user.cfg), passwords (priv/shadow.cfg), API tokens
# (priv/token.cfg), 2FA (priv/tfa.cfg), the firewall, datacenter settings, guest
# configs (qemu-server/*.conf) and the CA. /etc/pve is pmxcfs (FUSE); tar reads
# it as regular files. While reading a live pmxcfs tar may return rc=1
# ("file changed as we read it"), which is treated as success.
proxmox_backup_node_config: true
proxmox_backup_node_config_paths:
  - /etc/pve
  - /etc/network/interfaces
  - /etc/hosts
  - /etc/hostname
  - /etc/resolv.conf
  - /etc/ssh
  # OS accounts: PVE users in the @pam realm authenticate via Linux, so their
  # logins/passwords live here, not in /etc/pve. Without these, user.cfg
  # restores only the user object and permissions, not the ability to log in.
  - /etc/passwd
  - /etc/shadow
  - /etc/group
  - /etc/gshadow
  - /etc/sudoers
  - /etc/sudoers.d

# ISO images and container templates, handled by backup_proxmox_template_files.yml
# rather than by the guest backup. vzdump captures guests, not the media they were
# installed from, so after a reinstall these directories come back empty. They are
# also the awkward kind of file to reassemble by hand: point releases move to
# archive mirrors and driver ISOs tend to be pinned to a version.
# Kept out of the guest backup because the cadence differs. Guests are worth
# dumping regularly, these change a couple of times a year.
proxmox_backup_template_dirs:
  - /var/lib/vz/template/iso
  - /var/lib/vz/template/cache
proxmox_backup_template_subdir: template
